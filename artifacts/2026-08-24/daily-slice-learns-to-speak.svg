<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Slice learns to speak</title>
  <desc id="desc">A four-stage loop: Daily Slice memory flows into Autodisco metabolism, then Radio expression, then Encounter return pressure, which becomes a new Daily Slice. A separate note states that information circulates while authority remains local.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c2925"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2c2925" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f1eadc"/>
  <circle cx="1040" cy="92" r="128" fill="#e4b84d" opacity="0.28"/>
  <circle cx="1110" cy="555" r="180" fill="#4f8b86" opacity="0.10"/>

  <text x="70" y="80" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#211f1c">The Daily Slice learns to speak</text>
  <text x="72" y="116" font-family="Arial, sans-serif" font-size="20" fill="#5e574f">memory → metabolism → expression → encounter → memory</text>

  <path d="M 342 245 C 445 190, 540 190, 622 245" fill="none" stroke="#2c2925" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 758 318 C 825 355, 825 430, 750 469" fill="none" stroke="#2c2925" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 603 525 C 498 570, 402 570, 310 518" fill="none" stroke="#2c2925" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 218 442 C 155 394, 156 317, 221 277" fill="none" stroke="#2c2925" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="145" y="175" rx="28" width="230" height="150" fill="#fffaf0" stroke="#2c2925" stroke-width="2"/>
    <text x="175" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#9c4f36">DAILY SLICE</text>
    <text x="175" y="259" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#211f1c">Memory</text>
    <text x="175" y="290" font-family="Arial, sans-serif" font-size="16" fill="#5e574f">dated historical witness</text>
  </g>

  <g filter="url(#soft)">
    <rect x="610" y="175" rx="28" width="260" height="150" fill="#fffaf0" stroke="#2c2925" stroke-width="2"/>
    <text x="640" y="220" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#4f8b86">AUTODISCO v20</text>
    <text x="640" y="259" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#211f1c">Metabolism</text>
    <text x="640" y="290" font-family="Arial, sans-serif" font-size="16" fill="#5e574f">select · sequence · bound</text>
  </g>

  <g filter="url(#soft)">
    <rect x="610" y="430" rx="28" width="260" height="150" fill="#fffaf0" stroke="#2c2925" stroke-width="2"/>
    <text x="640" y="475" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#b88a28">RADIO</text>
    <text x="640" y="514" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#211f1c">Expression</text>
    <text x="640" y="545" font-family="Arial, sans-serif" font-size="16" fill="#5e574f">first-listen interpretation</text>
  </g>

  <g filter="url(#soft)">
    <rect x="145" y="430" rx="28" width="230" height="150" fill="#fffaf0" stroke="#2c2925" stroke-width="2"/>
    <text x="175" y="475" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#6f655d">ENCOUNTER</text>
    <text x="175" y="514" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#211f1c">Return</text>
    <text x="175" y="545" font-family="Arial, sans-serif" font-size="16" fill="#5e574f">consequence · question · reply</text>
  </g>

  <g>
    <circle cx="510" cy="365" r="76" fill="#211f1c"/>
    <circle cx="510" cy="365" r="52" fill="none" stroke="#f1eadc" stroke-width="2" opacity="0.6"/>
    <circle cx="510" cy="365" r="14" fill="#e4b84d"/>
    <path d="M 494 338 C 535 344, 548 376, 528 400" fill="none" stroke="#f1eadc" stroke-width="3" stroke-linecap="round"/>
    <text x="510" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#5e574f">THE STATION REMEMBERS</text>
  </g>

  <line x1="72" y1="620" x2="1128" y2="620" stroke="#b8ad9c" stroke-width="1"/>
  <text x="72" y="649" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#211f1c">Information circulates. Authority stays local.</text>
  <text x="1128" y="649" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6f655d">Daily Slice · 2026-08-24</text>
</svg>
