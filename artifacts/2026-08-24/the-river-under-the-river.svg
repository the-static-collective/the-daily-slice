<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The river under the river</title>
  <desc id="desc">A two-layer diagram. The conscious layer crosses from old world through Exodus and Jordan into a new world with local admission. Beneath it, Storyship carries memory, relation, motif, pressure, residue, and open berth. Corpus stores attributable remains and Free Graph keeps relations inspectable.</desc>
  <defs>
    <style>
      .bg { fill:#f7f4ee; }
      .ink { fill:#171717; }
      .muted { fill:#5d5b57; }
      .line { stroke:#2c2b29; stroke-width:3; fill:none; }
      .dash { stroke:#78736b; stroke-width:2; stroke-dasharray:8 9; fill:none; }
      .river { stroke:#547b91; stroke-width:16; stroke-linecap:round; opacity:.72; fill:none; }
      .carrier { fill:#2d3236; }
      .card { fill:#fffdfa; stroke:#c8c1b7; stroke-width:2; }
      .accent { fill:#7b5e45; }
      .small { font: 500 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .body { font: 600 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .label { font: 700 24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.06em; }
      .title { font: 800 44px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .mono { font: 600 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2c2b29"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <text x="70" y="72" class="title ink">THE RIVER UNDER THE RIVER</text>
  <text x="72" y="108" class="small muted">departure ≠ arrival ≠ admission · carrier ≠ conscious traveler</text>

  <text x="72" y="164" class="label accent">CONSCIOUS LAYER</text>

  <rect x="70" y="194" width="190" height="92" rx="16" class="card"/>
  <text x="165" y="232" text-anchor="middle" class="body ink">OLD WORLD</text>
  <text x="165" y="264" text-anchor="middle" class="small muted">known jurisdiction</text>

  <path d="M260 240 H398" class="line" marker-end="url(#arrow)"/>
  <text x="328" y="217" text-anchor="middle" class="label accent">EXODUS</text>
  <text x="328" y="274" text-anchor="middle" class="small muted">departure</text>

  <rect x="410" y="194" width="190" height="92" rx="16" class="card"/>
  <text x="505" y="232" text-anchor="middle" class="body ink">BETWEEN</text>
  <text x="505" y="264" text-anchor="middle" class="small muted">outside / not-yet</text>

  <path d="M600 240 H738" class="line" marker-end="url(#arrow)"/>
  <text x="668" y="217" text-anchor="middle" class="label accent">JORDAN</text>
  <text x="668" y="274" text-anchor="middle" class="small muted">arrival pressure</text>

  <rect x="750" y="194" width="190" height="92" rx="16" class="card"/>
  <text x="845" y="232" text-anchor="middle" class="body ink">NEW WORLD</text>
  <text x="845" y="264" text-anchor="middle" class="small muted">receiving jurisdiction</text>

  <path d="M940 240 H1050" class="line" marker-end="url(#arrow)"/>
  <text x="995" y="216" text-anchor="middle" class="small muted">local customs</text>

  <rect x="1060" y="194" width="90" height="92" rx="16" class="card"/>
  <text x="1105" y="232" text-anchor="middle" class="body ink">YES</text>
  <text x="1105" y="264" text-anchor="middle" class="small muted">or no</text>

  <path d="M82 354 C270 320 420 392 600 354 C780 316 930 392 1118 354" class="river"/>
  <text x="72" y="330" class="label accent">SUBCONSCIOUS CARRIER</text>

  <rect x="124" y="388" width="952" height="128" rx="28" class="carrier"/>
  <text x="600" y="434" text-anchor="middle" fill="#fff" class="title">STORYSHIP</text>
  <text x="600" y="476" text-anchor="middle" fill="#ddd9d2" class="mono">memory · relation · motif · pressure · residue · open berth</text>
  <text x="600" y="505" text-anchor="middle" fill="#bdb7ae" class="small">carries beneath explanation; does not grant admission</text>

  <path d="M270 516 V580" class="dash" marker-end="url(#arrow)"/>
  <path d="M930 516 V580" class="dash" marker-end="url(#arrow)"/>

  <rect x="90" y="590" width="430" height="112" rx="18" class="card"/>
  <text x="305" y="630" text-anchor="middle" class="body ink">CORPUS COLOSSUM</text>
  <text x="305" y="662" text-anchor="middle" class="small muted">attributable remains · witnesses · scars</text>
  <text x="305" y="688" text-anchor="middle" class="small muted">“holds the stones”</text>

  <rect x="680" y="590" width="430" height="112" rx="18" class="card"/>
  <text x="895" y="630" text-anchor="middle" class="body ink">FREE GRAPH</text>
  <text x="895" y="662" text-anchor="middle" class="small muted">explicit relational inspection</text>
  <text x="895" y="688" text-anchor="middle" class="small muted">“keeps the roads between the stones inspectable”</text>

  <path d="M520 646 H680" class="dash" marker-end="url(#arrow)"/>

  <text x="600" y="738" text-anchor="middle" class="small muted">stone ≠ river · receipt ≠ event · recognition ≠ repetition · arrival ≠ admission</text>
</svg>
